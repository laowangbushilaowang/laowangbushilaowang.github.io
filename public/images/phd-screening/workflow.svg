<g font-size="18" fill="#536674"><text x="66" y="163">Find the actual academic units</text><text x="66" y="187">Keep source URLs and gaps</text><text x="432" y="163">Merge the same person</text><text x="432" y="187">Preserve all affiliations</text><text x="798" y="163">Official profile + personal site</text><text x="798" y="187">Research, openings, dates</text><text x="304" y="354">Problems, methods, reasons</text><text x="304" y="378">Guide further reading</text><text x="614" y="354">yes / no / uncertain</text><text x="614" y="378">Degree, intake, deadline</text></g>
