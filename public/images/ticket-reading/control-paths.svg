<g font-size="17" fill="#536876"><text x="56" y="178">Describe the actions</text><text x="315" y="178">Receive requests</text><text x="574" y="178">Android driver</text><text x="833" y="178">Inspect and interact with UI</text><text x="56" y="339">A separate toolchain, without Appium Server</text><text x="833" y="339">Inspect and interact with UI</text></g>
