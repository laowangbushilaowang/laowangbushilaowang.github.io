<title id="t">Two Android UI automation control paths</title><desc id="d">The Appium path uses a Python client, Appium Server, a UiAutomator2 driver and device automation components. A Python uiautomator2 client uses a different toolchain without a separate Appium Server. Both rely on Android device automation. This is a schematic.</desc>
