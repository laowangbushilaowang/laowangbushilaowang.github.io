<g fill="white" stroke="#c4cfd6" stroke-width="1.5"><rect x="36" y="112" width="205" height="88" rx="10"/><rect x="295" y="112" width="205" height="88" rx="10"/><rect x="554" y="112" width="205" height="88" rx="10"/><rect x="813" y="112" width="270" height="88" rx="10" fill="#e8f0f0"/><rect x="36" y="273" width="464" height="88" rx="10"/><rect x="813" y="273" width="270" height="88" rx="10" fill="#e8f0f0"/></g>
