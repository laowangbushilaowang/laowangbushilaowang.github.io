<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="514" viewBox="0 0 1120 514" role="img"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#7a929e"/></marker></defs><g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"><rect width="1120" height="514" rx="22" fill="#f8faf9"/><text x="40" y="52" font-size="16" fill="#397264" font-weight="600">BIOFLOW / FILES AND SAMPLE IDENTITIES</text><text x="40" y="98" font-size="30" fill="#152f43" font-weight="650">Choose the files. Then reconcile sample IDs.</text><rect x="40" y="139" width="315" height="292" rx="14" fill="#142f43" stroke="#142f43"/><text x="62" y="175" font-size="17" fill="#e0eceb" font-weight="500">sample_A/</text><text x="62" y="205" font-size="17" fill="#e0eceb" font-weight="500">  matrix.mtx.gz</text><text x="62" y="235" font-size="17" fill="#e0eceb" font-weight="500">  features.tsv.gz</text><text x="62" y="265" font-size="17" fill="#e0eceb" font-weight="500">  barcodes.tsv.gz</text><text x="62" y="295" font-size="17" fill="#e0eceb" font-weight="500"></text><text x="62" y="325" font-size="17" fill="#e0eceb" font-weight="500">sample_B/</text><text x="62" y="355" font-size="17" fill="#e0eceb" font-weight="500">  matrix + features + barcodes</text><path d="M365 206 L405 206" fill="none" stroke="#7a929e" stroke-width="2" marker-end="url(#a)"/><path d="M365 363 L405 363" fill="none" stroke="#7a929e" stroke-width="2" marker-end="url(#a)"/><rect x="416" y="143" width="336" height="128" rx="14" fill="#fff" stroke="#d6e0e6"/><text x="434" y="178" font-size="19" fill="#152f43" font-weight="600">01  Choose reader + file groups</text><text x="434" y="213" font-size="16" fill="#587080" font-weight="400">Tree, file candidates, text hints</text><text x="434" y="242" font-size="16" fill="#587080" font-weight="400">One item groups the three files</text><path d="M763 207 L803 207" fill="none" stroke="#7a929e" stroke-width="2" marker-end="url(#a)"/><rect x="416" y="303" width="336" height="128" rx="14" fill="#fff" stroke="#d6e0e6"/><text x="434" y="338" font-size="19" fill="#152f43" font-weight="600">02  Reconcile sample IDs</text><text x="434" y="373" font-size="16" fill="#587080" font-weight="400">Existing IDs, cell counts, paths</text><text x="434" y="402" font-size="16" fill="#587080" font-weight="400">Source-table and LLM mappings</text><path d="M763 367 L803 367" fill="none" stroke="#7a929e" stroke-width="2" marker-end="url(#a)"/><rect x="816" y="143" width="264" height="128" rx="14" fill="#eef3de" stroke="#d5dfbb"/><text x="834" y="178" font-size="20" fill="#152f43" font-weight="600">raw.h5ad</text><text x="834" y="213" font-size="16" fill="#52613b" font-weight="400">Programs run the reader</text><text x="834" y="242" font-size="16" fill="#52613b" font-weight="400">Keep source references</text><rect x="816" y="303" width="264" height="128" rx="14" fill="#eef3de" stroke="#d5dfbb"/><text x="834" y="338" font-size="20" fill="#152f43" font-weight="600">sample_id</text><text x="834" y="373" font-size="16" fill="#52613b" font-weight="400">Check mapping / fallback</text><text x="834" y="402" font-size="16" fill="#52613b" font-weight="400">Verify biological identity</text><text x="40" y="475" font-size="17" fill="#587080" font-weight="400">sample_A/B are examples · Two operations redrawn from project code.</text></g></svg>