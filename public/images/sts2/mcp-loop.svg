<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="480" viewBox="0 0 1120 480" role="img" aria-labelledby="t d"><title id="t">STS2 local MCP loop</title><desc id="d">Game state passes through the C sharp Mod and Python MCP server to Codex. Actions return to the game and a new state is read.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 8 4 0 8" fill="#527d91"/></marker></defs><rect width="1120" height="480" rx="24" fill="#f3f6f7"/><g font-family="Arial,sans-serif" fill="#243d51"><text x="48" y="53" font-size="25" font-weight="700">Slay the Spire 2 · local MCP integration</text><text x="48" y="82" font-size="16" fill="#5a6a75">Source-based schematic · local v0.5.2</text><g fill="#fff" stroke="#c8d5dc" stroke-width="2"><rect x="48" y="132" width="290" height="196" rx="14"/><rect x="414" y="132" width="290" height="196" rx="14"/><rect x="780" y="132" width="290" height="196" rx="14"/></g><g font-size="24" font-weight="700"><text x="72" y="175">Game + C# Mod</text><text x="438" y="175">Python MCP</text><text x="804" y="175">Codex</text></g><g font-size="18"><text x="72" y="216">Hand · energy · enemies</text><text x="72" y="249">Local HTTP API</text><text x="72" y="282">Execute on game thread</text><text x="438" y="216">get_game_state</text><text x="438" y="249">get_available_actions</text><text x="438" y="282">act / wait_until_actionable</text><text x="804" y="216">Read current state</text><text x="804" y="249">Choose one legal action</text><text x="804" y="282">Refresh card indexes</text></g><g stroke="#527d91" stroke-width="3" fill="none" marker-end="url(#a)"><path d="M340 208H403"/><path d="M706 208H769"/><path d="M925 330V382H195V340"/></g><g font-size="15" fill="#5a6a75"><text x="347" y="190">state</text><text x="714" y="190">tools</text></g><text x="392" y="413" font-size="18">Action → updated game state → read again</text><text x="48" y="453" font-size="14" fill="#6d7d86">Framework: CharTyr/STS2-Agent · Diagram describes integration, not a gameplay screenshot.</text></g></svg>